; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:nanoatmega328]
platform = atmelavr
board = nanoatmega328
framework = arduino

build_src_filter =
    +<main.cpp>
    +<domain/Pattern.cpp>
    +<domain/PatternBank.cpp>
    +<domain/SequencerEngine.cpp>
    -<simavr_main.cpp>

lib_deps =
    https://git.sitkainstruments.com/awonak/libGravity.git#9be88be1f4
    gicking/NeoHWSerial@1.6.9


; Host-native env for hardware-free domain unit tests (Pattern / PatternBank).
; Compiles only the pure-C++ domain sources (no Arduino / libGravity), so the
; test loop runs on macOS/Linux without a Gravity board. Firmware envs above
; are untouched.
[env:native]
platform = native

build_src_filter =
    +<domain/Pattern.cpp>
    +<domain/PatternBank.cpp>
    +<domain/SequencerEngine.cpp>

build_flags = -std=gnu++11 -Iinclude

; Link the project domain sources (above filter) into the test binary.
test_build_src = yes
test_filter =
    test_pattern*
    test_sequencer_engine
    test_transport
    test_trigger_sequencer
    test_subdiv
    test_pattern_screen
    test_paged_screen


; Caracterisation de la dependance libGravity @ 9be88be1f4 — environnement
; SEPARE, jamais melange aux tests d'acceptation FlexSeq. Ces tests documentent
; le comportement REEL de la dependance figee : ils peuvent rester ROUGES quand
; ils reproduisent une anomalie auditee (regle CLAUDE.md). Les tenir hors de
; env:native est precisement ce qui permet a `pio test -e native` de rester un
; signal fiable.
;
; Ils compilent les en-tetes libGravity contre les bouchons Arduino de
; test/mocks/. Le chemin -I pointe .pio/libdeps/nanoatmega328/ : l'env AVR doit
; donc avoir ete construit au moins une fois (`pio run -e nanoatmega328`).
;
; Regression evitee : c'est la perte de ces deux -I (commit f0d6134, PR #1),
; conjuguee a l'apparition de test_filter dans le meme commit, qui avait rendu
; ces six tests silencieusement non compilables.
[env:native_libgravity]
platform = native

build_flags =
    -std=gnu++11
    -I.pio/libdeps/nanoatmega328/libGravity/src
    -Itest/mocks

test_filter =
    test_analog_input
    test_button
    test_clock
    test_digital_output
    test_encoder
    test_gravity


[env:simavr]
platform = atmelavr
board = nanoatmega328
framework = arduino

build_src_filter =
    +<simavr_main.cpp>
    +<domain/Pattern.cpp>
    +<domain/PatternBank.cpp>
    +<domain/SequencerEngine.cpp>
    -<main.cpp>

lib_deps =
    https://git.sitkainstruments.com/awonak/libGravity.git#9be88be1f4
    gicking/NeoHWSerial@1.6.9

; Harnais de validation VISUELLE pour Wokwi (extension VS Code).
; Compile le FIRMWARE REEL (domaine + renderer + display libGravity) avec un
; contenu de demonstration precharge. Voir wokwi.toml a la racine.
[env:wokwi]
platform = atmelavr
board = nanoatmega328
framework = arduino

build_src_filter =
    +<wokwi_main.cpp>
    +<domain/Pattern.cpp>
    +<domain/PatternBank.cpp>
    +<domain/SequencerEngine.cpp>
    -<main.cpp>
    -<simavr_main.cpp>

lib_deps =
    https://git.sitkainstruments.com/awonak/libGravity.git#9be88be1f4
    gicking/NeoHWSerial@1.6.9
