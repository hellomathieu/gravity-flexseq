; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:nanoatmega328]
platform = atmelavr
board = nanoatmega328
framework = arduino

build_src_filter =
    +<main.cpp>
    +<domain/Pattern.cpp>
    +<domain/PatternStore.cpp>
    -<simavr_main.cpp>

lib_deps =
    https://git.sitkainstruments.com/awonak/libGravity.git#9be88be1f4
    gicking/NeoHWSerial@1.6.9


[env:simavr]
platform = atmelavr
board = nanoatmega328
framework = arduino

build_src_filter =
    +<simavr_main.cpp>
    -<main.cpp>

lib_deps =
    https://git.sitkainstruments.com/awonak/libGravity.git#9be88be1f4
    gicking/NeoHWSerial@1.6.9