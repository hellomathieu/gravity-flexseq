; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:nanoatmega328]
platform = atmelavr
board = nanoatmega328
framework = arduino

build_src_filter =
    +<main.cpp>
    +<domain/Pattern.cpp>
    +<domain/PatternBank.cpp>
    +<domain/SequencerEngine.cpp>
    -<simavr_main.cpp>

lib_deps =
    https://git.sitkainstruments.com/awonak/libGravity.git#9be88be1f4
    gicking/NeoHWSerial@1.6.9


; Host-native env for hardware-free domain unit tests (Pattern / PatternBank).
; Compiles only the pure-C++ domain sources (no Arduino / libGravity), so the
; test loop runs on macOS/Linux without a Gravity board. Firmware envs above
; are untouched.
[env:native]
platform = native

build_src_filter =
    +<domain/Pattern.cpp>
    +<domain/PatternBank.cpp>
    +<domain/SequencerEngine.cpp>

build_flags = -std=gnu++11 -Iinclude

; Link the project domain sources (above filter) into the test binary.
test_build_src = yes
test_filter =
    test_pattern*
    test_sequencer_engine
    test_transport
    test_trigger_sequencer
    test_subdiv
    test_pattern_screen


[env:simavr]
platform = atmelavr
board = nanoatmega328
framework = arduino

build_src_filter =
    +<simavr_main.cpp>
    +<domain/Pattern.cpp>
    +<domain/PatternBank.cpp>
    +<domain/SequencerEngine.cpp>
    -<main.cpp>

lib_deps =
    https://git.sitkainstruments.com/awonak/libGravity.git#9be88be1f4
    gicking/NeoHWSerial@1.6.9

; Harnais de validation VISUELLE pour Wokwi (extension VS Code).
; Compile le FIRMWARE REEL (domaine + renderer + display libGravity) avec un
; contenu de demonstration precharge. Voir wokwi.toml a la racine.
[env:wokwi]
platform = atmelavr
board = nanoatmega328
framework = arduino

build_src_filter =
    +<wokwi_main.cpp>
    +<domain/Pattern.cpp>
    +<domain/PatternBank.cpp>
    +<domain/SequencerEngine.cpp>
    -<main.cpp>
    -<simavr_main.cpp>

lib_deps =
    https://git.sitkainstruments.com/awonak/libGravity.git#9be88be1f4
    gicking/NeoHWSerial@1.6.9
