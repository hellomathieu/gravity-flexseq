; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[deps]
lib_deps =
    https://github.com/hellomathieu/libGravity.git#9be88be1f4
    gicking/NeoHWSerial@1.6.9
    olikraus/U8g2@2.36.18
    mathertel/RotaryEncoder@1.6.0


[env:nanoatmega328]
platform = atmelavr
board = nanoatmega328
framework = arduino
upload_speed = 115200

; Sans cela, PlatformIO detecte automatiquement le port et choisit
; /dev/cu.Bluetooth-Incoming-Port des que l'USB est debranche : avrdude parle
; alors au Bluetooth pendant 55 s avant d'echouer sur « not in sync », ce qui
; accuse le module a tort. Le motif ne matche que les adaptateurs USB-serie.
upload_port = /dev/cu.usbserial*

; -mcall-prologues : les prologues et epilogues de fonction appellent des
; sous-routines partagees au lieu d'etre repetes en ligne. 534 o de Flash rendus,
; mesures sur le firmware entierement cable (27746 -> 27212). Le cout est en
; cycles et en pile, et il est MESURE, pas suppose : voir la sonde de blocage et
; la sonde de pile. -fno-rtti et -fno-jump-tables ont ete essayes et ne rendent
; rien sur ce projet.
build_flags = -mcall-prologues

build_src_filter =
    +<main.cpp>
    +<hal/CvSampler.cpp>
    +<hal/HeapStub.cpp>
    +<hal/InputAdapter.cpp>
    +<hal/TransportAdapter.cpp>
    +<domain/Pattern.cpp>
    +<domain/PatternBank.cpp>
    +<domain/SequencerEngine.cpp>
    +<domain/Subdiv.cpp>
    +<domain/UiController.cpp>
    +<domain/Persistence.cpp>
    -<simavr_main.cpp>

extends = deps


; Host-native env for hardware-free domain unit tests (Pattern / PatternBank).
; Compiles only the pure-C++ domain sources (no Arduino / libGravity), so the
; test loop runs on macOS/Linux without a Gravity board. Firmware envs above
; are untouched.
[env:native]
platform = native

build_src_filter =
    +<domain/Pattern.cpp>
    +<domain/PatternBank.cpp>
    +<domain/SequencerEngine.cpp>
    +<domain/Subdiv.cpp>
    +<domain/UiController.cpp>
    +<domain/Persistence.cpp>

build_flags = -std=gnu++11 -Iinclude

; Link the project domain sources (above filter) into the test binary.
test_build_src = yes
test_filter =
    test_pattern*
    test_sequencer_engine
    test_transport
    test_trigger_sequencer
    test_subdiv
    test_pattern_screen
    test_paged_screen
    test_cv_gate
    test_ui_controller
    test_main_screen
    test_encoder_filter
    test_persistence
    test_ratchet_matrix
    test_subdiv_phase


[env:mainscreen]
extends = env:nanoatmega328

build_src_filter =
    +<mainscreen_demo_main.cpp>
    +<hal/CvSampler.cpp>
    +<hal/InputAdapter.cpp>
    +<hal/TransportAdapter.cpp>
    +<domain/Pattern.cpp>
    +<domain/PatternBank.cpp>
    +<domain/SequencerEngine.cpp>
    +<domain/Subdiv.cpp>
    +<domain/UiController.cpp>


; Caracterisation de la dependance libGravity @ 9be88be1f4 — environnement
; SEPARE, jamais melange aux tests d'acceptation FlexSeq. Ces tests documentent
; le comportement REEL de la dependance figee : ils peuvent rester ROUGES quand
; ils reproduisent une anomalie auditee (regle CLAUDE.md). Les tenir hors de
; env:native est precisement ce qui permet a `pio test -e native` de rester un
; signal fiable.
;
; Ils compilent les en-tetes libGravity contre les bouchons Arduino de
; test/mocks/. Le chemin -I pointe .pio/libdeps/nanoatmega328/ : l'env AVR doit
; donc avoir ete construit au moins une fois (`pio run -e nanoatmega328`).
;
; Regression evitee : c'est la perte de ces deux -I (commit f0d6134, PR #1),
; conjuguee a l'apparition de test_filter dans le meme commit, qui avait rendu
; ces six tests silencieusement non compilables.
[env:native_adapter]
platform = native

build_flags =
    -std=gnu++11
    -Iinclude
    -I.pio/libdeps/nanoatmega328/libGravity/src
    -Itest/mocks

build_src_filter =
    +<domain/Pattern.cpp>
    +<domain/PatternBank.cpp>
    +<domain/SequencerEngine.cpp>
    +<domain/Subdiv.cpp>
    +<domain/UiController.cpp>

test_build_src = yes

test_filter =
    test_input_adapter


[env:native_libgravity]
platform = native

build_flags =
    -std=gnu++11
    -I.pio/libdeps/nanoatmega328/libGravity/src
    -Itest/mocks

test_filter =
    test_analog_input
    test_button
    test_clock
    test_digital_output
    test_encoder
    test_gravity


[env:simavr]
platform = atmelavr
board = nanoatmega328
framework = arduino

build_src_filter =
    +<simavr_main.cpp>
    +<hal/CvSampler.cpp>
    +<domain/Pattern.cpp>
    +<domain/PatternBank.cpp>
    +<domain/SequencerEngine.cpp>
    -<main.cpp>

extends = deps

; Harnais de validation VISUELLE pour Wokwi (extension VS Code).
; Compile le FIRMWARE REEL (domaine + renderer + display libGravity) avec un
; contenu de demonstration precharge. Voir wokwi.toml a la racine.
[env:wokwi]
platform = atmelavr
board = nanoatmega328
framework = arduino

build_src_filter =
    +<wokwi_main.cpp>
    +<hal/CvSampler.cpp>
    +<domain/Pattern.cpp>
    +<domain/PatternBank.cpp>
    +<domain/SequencerEngine.cpp>
    -<main.cpp>
    -<simavr_main.cpp>

extends = deps


; MISE EN ROUTE sur le module physique : chaque peripherique exerce separement,
; resultats lisibles a l'ecran. Voir l'en-tete de src/bringup_main.cpp.
; Ne contient NI sequenceur, NI pattern, NI persistance — c'est un diagnostic.
[env:encoderprobe]
platform = atmelavr
board = nanoatmega328
framework = arduino
upload_speed = 115200
upload_port = /dev/cu.usbserial*

build_flags = -mcall-prologues -DFLEXSEQ_ENCODER_PROBE=1

build_src_filter =
    +<main.cpp>
    +<hal/CvSampler.cpp>
    +<hal/EncoderProbe.cpp>
    +<hal/HeapStub.cpp>
    +<hal/InputAdapter.cpp>
    +<hal/TransportAdapter.cpp>
    +<domain/Pattern.cpp>
    +<domain/PatternBank.cpp>
    +<domain/SequencerEngine.cpp>
    +<domain/Subdiv.cpp>
    +<domain/UiController.cpp>
    +<domain/Persistence.cpp>
    -<simavr_main.cpp>

extends = deps


[env:bringup]
platform = atmelavr
board = nanoatmega328
framework = arduino
upload_speed = 115200
upload_port = /dev/cu.usbserial*

build_src_filter =
    +<bringup_main.cpp>
    +<hal/CvSampler.cpp>
    -<main.cpp>
    -<simavr_main.cpp>
    -<wokwi_main.cpp>
    -<domain/>

extends = deps


; SAUVEGARDE de l'EEPROM du module, avant que FlexSeq n'y ecrive quoi que ce
; soit. Le bootloader optiboot ne sait PAS lire l'EEPROM : avrdude rend alors du
; contenu de flash sans signaler d'erreur (verifie le 2026-08-21). Le firmware la
; lit donc lui-meme et l'emet en Intel HEX sur le port serie a 9600 bauds.
; AUCUNE dependance : ni libGravity, ni NeoHWSerial, qui remplacerait l'ISR du
; port serie. Lecture seule. Voir PRD 2.
[env:eepromdump]
platform = atmelavr
board = nanoatmega328
framework = arduino
upload_speed = 115200
upload_port = /dev/cu.usbserial*

build_src_filter =
    +<eeprom_dump_main.cpp>
    -<main.cpp>
    -<bringup_main.cpp>
    -<simavr_main.cpp>
    -<wokwi_main.cpp>
    -<hal/>
    -<domain/>
